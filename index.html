<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupcake AI - Your Sweetest Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #FFD1DC; /* Now Baby Pink */
      color: #5D3A42;
    }
    .cupcake-gradient {
      background: linear-gradient(135deg, #FFD1DC 0%, #FFB6C1 50%, #BFEFFF 100%);
    }
    .message-pink {
      background-color: #FFF5F7; /* Now Lightest Pink/Cream */
      color: #8E4D5B;
    }
    .message-light-pink {
      background-color: #FFB6C1;
      color: #7A3B49;
    }
    .message-blue {
      background-color: #E0F8FF;
      color: #3D5A80;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FFD1DC; /* Match new background */
    }
    ::-webkit-scrollbar-thumb {
      background: #FFB6C1;
      border-radius: 10px;
      border: 2px solid #FFD1DC;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FF9AA2;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",

  }
}
</script>
</head>

</body>
